  live: false
  turns: [{say: "Dr Rao on 20 October", extract: {intent: book, doctor: "Dr Rao", date: "2024-10-20"}, expect: {reply_has: ["20 Oct"]}}]
- id: fact-booked-only-after-yes
  category: facts
  turns:
    - {say: "Book Dr Rao tomorrow. New patient Neha Rao, 30, 9123456789", extract: {intent: book, doctor: "Dr Rao", date: tomorrow, name: "Neha Rao", age: 30, phone: "9123456789"}}
    - {answer: "yes", expect: {confirmed_added: 0}}
    - {say: "2", extract: {intent: book, option: 2}, expect: {interrupt: confirm, confirmed_added: 0}}
    - {answer: "yes", expect: {reply_has: ["✅"], confirmed_added: 1}}

