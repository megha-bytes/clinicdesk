# Render Blueprint for the ClinicDesk backend (free plan).
# Render looks for render.yaml at the repo root by default; when creating the Blueprint,
# point it at deploy/render.yaml (or copy this file to the root).
# Secrets are NOT stored here: values marked `sync: false` are entered in the Render dashboard.
services:
  - type: web
    name: clinicdesk-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ping        # no DB query, so Neon can scale to zero
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: prod
      - key: SECRETS_PROVIDER
        value: env
      - key: OTEL_ENABLED
        value: "true"
      - key: DATABASE_URL           # Neon / Supabase connection string
        sync: false
      - key: TOKEN_FACTORY_API_KEY  # PROD key (not your laptop key)
        sync: false
      - key: CORS_ORIGINS           # the patient app's URL (comma-separated if several)
        value: https://clinicdesk-app.onrender.com,http://localhost:5173
      - key: PUBLIC_BASE_URL        # builds the demo payment links
        value: https://clinicdesk-api.onrender.com
      - key: PAYMENT_PROVIDER
        value: mock
      - key: DEMO_RESET_TOKEN       # long random string; also stored as a GitHub Actions secret
        sync: false

  # Patient app (React, built to static files). Free static sites don't sleep.
  - type: web
    name: clinicdesk-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://clinicdesk-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
