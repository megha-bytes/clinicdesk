# Local development stack. From the repo root:
#   docker compose -f deploy/docker-compose.yml up --build
# API:     http://localhost:8000/health   (docs at /docs)
# Jaeger:  http://localhost:16686          (traces)
name: clinicdesk

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clinicdesk
      POSTGRES_PASSWORD: clinicdesk     # local only
      POSTGRES_DB: clinicdesk
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicdesk"]
      interval: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otel-collector.yaml:ro"]
    ports: ["4317:4317"]
    depends_on: [jaeger]

  backend:
    build: ../backend
    env_file:
      - path: ../.env.local          # your dev keys (git-ignored); optional
        required: false
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://clinicdesk:clinicdesk@postgres:5432/clinicdesk
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      otel-collector: {condition: service_started}

volumes:
  pgdata:
