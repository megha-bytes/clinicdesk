name: Red-team (live, nightly)

# Runs the red-team conversations against the deployed app with the real Nemotron models.
# Needs the repository secret REDTEAM_TOKEN (same value as on Render) to skip the per-IP rate limit.
on:
  schedule:
    - cron: "40 21 * * *"      # 03:10 IST, after the nightly demo reset
  workflow_dispatch:

jobs:
  redteam:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Wake the backend (free tier sleeps)
        run: curl -s --retry 5 --retry-delay 10 --max-time 60 https://clinicdesk-api.onrender.com/ping
      - name: Run live red-team
        env:
          REDTEAM_TOKEN: ${{ secrets.REDTEAM_TOKEN }}
        run: python ../scripts/redteam.py --live https://clinicdesk-api.onrender.com --out ../docs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redteam-live
          path: docs/redteam-live.*
